name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "Dockerfile", ".dockerignore", "deploy/**", "scripts/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "Dockerfile", ".dockerignore", "deploy/**", "scripts/**", ".github/workflows/server.yml"]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install ffmpeg for scanner and artwork tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - name: Web client parses (no build step, so this is its compile)
        run: web/check-js.sh
      - name: Deploy script refuses mid-stream and labels the build
        run: ../deploy/deploy_test.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: server
      - name: Tests (race detector, includes the OpenAPI drift test)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: vcrx-media-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm vcrx-media-server:ci version
          docker run --rm --entrypoint ffprobe vcrx-media-server:ci -version | head -1
          docker compose -f deploy/compose.yaml config -q
        env:
          VCRX_MOVIES_DIR: /tmp
          VCRX_TV_DIR: /tmp

  # The web app in a real browser: every page renders without throwing or showing
  # "null", and a direct and a converted stream both play. Runs against
  # scripts/dev-server.sh and its generated clips; Chrome comes with the runner.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install ffmpeg for the sample clips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # dev-server.sh skips every clip that already exists, so a cached media
      # folder saves most of a minute and a half. The key changes with the
      # script or the ffmpeg build, so a changed clip is never served stale.
      - name: Key the sample media
        id: media
        run: echo "ffmpeg=$(ffmpeg -version | head -1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcrx-dev/media
          key: vcrx-dev-media-${{ runner.os }}-${{ steps.media.outputs.ffmpeg }}-${{ hashFiles('scripts/dev-server.sh') }}
      - name: Start the dev servers and wait for their first scans
        run: |
          # One scan line per library on each server: Movies, TV and Music.
          scans() { grep -c '^scan ' "$1" || true; }
          VCRX_DEV_DIR="$RUNNER_TEMP/vcrx-dev" ./scripts/dev-server.sh > "$RUNNER_TEMP/dev.log" 2>&1 &
          for _ in $(seq 1 240); do
            [ "$(scans "$RUNNER_TEMP/dev.log")" -ge 3 ] && break
            sleep 1
          done
          [ "$(scans "$RUNNER_TEMP/dev.log")" -ge 3 ] || { echo "dev server did not finish its scans"; tail -n 50 "$RUNNER_TEMP/dev.log"; exit 1; }
          # A second server, linked to the first as a friend's server. It starts
          # with a copy of the first one's sample media, which dev-server.sh
          # keeps: built twice at once, the two outran the wait on this runner.
          mkdir -p "$RUNNER_TEMP/vcrx-peer"
          cp -R "$RUNNER_TEMP/vcrx-dev/media" "$RUNNER_TEMP/vcrx-peer/"
          VCRX_DEV_DIR="$RUNNER_TEMP/vcrx-peer" VCRX_PORT=3752 VCRX_DEV_NAME="VCRX Peer" ./scripts/dev-server.sh > "$RUNNER_TEMP/peer.log" 2>&1 &
          for _ in $(seq 1 120); do
            [ "$(scans "$RUNNER_TEMP/peer.log")" -ge 3 ] && exit 0
            sleep 1
          done
          echo "peer server did not finish its scans"; tail -n 50 "$RUNNER_TEMP/peer.log"; exit 1
      - name: Web smoke test in headless Chrome
        run: node scripts/web-smoke.mjs http://127.0.0.1:3751
        env:
          VCRX_SMOKE_PEER: http://127.0.0.1:3752
      - name: Server log
        if: failure()
        # -n: GNU tail refuses the bare -100 form once it is given two files.
        run: tail -n 100 "$RUNNER_TEMP/dev.log" "$RUNNER_TEMP/peer.log"

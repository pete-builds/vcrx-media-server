name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "Dockerfile", ".dockerignore", "deploy/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "Dockerfile", ".dockerignore", "deploy/**", ".github/workflows/server.yml"]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install ffmpeg for scanner and artwork tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: server
      - name: Tests (race detector, includes the OpenAPI drift test)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: vcrx-media-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm vcrx-media-server:ci version
          docker run --rm --entrypoint ffprobe vcrx-media-server:ci -version | head -1
          docker compose -f deploy/compose.yaml config -q
        env:
          VCRX_MOVIES_DIR: /tmp
          VCRX_TV_DIR: /tmp

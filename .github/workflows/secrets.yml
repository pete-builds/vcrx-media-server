name: secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: No real home network or home directory in public files
        run: scripts/check-private.sh
      # deploy.sh runs on the production host and tv/build-apk.sh signs the
      # release APK: a quoting slip in either fails at the worst moment.
      # Pinned by checksum: the runner image's shellcheck (0.9.0 in 2026-11)
      # reports checks newer releases dropped, so an image update could red
      # this with no change to any script.
      - name: Shell scripts pass shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          sc="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck"
          "$sc" --version | sed -n 2p
          git ls-files -z '*.sh' | xargs -0 "$sc"

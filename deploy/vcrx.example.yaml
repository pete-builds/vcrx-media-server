# VCRX settings file, read from /config/vcrx.yaml. Environment variables win.
# Libraries listed here are created or updated by name at startup; libraries you
# add with `vcrx library add` are left alone.
server_name: VCRX

# Sign in without a password from your own networks: clients on trusted_networks
# become this user. There is no default list: private ranges also cover the
# host's Docker bridges. Name your LAN subnets and Tailscale devices. Anyone on
# them gets that user's access, so leave it off on a network you share.
#auto_sign_in_user: admin
#trusted_networks: [192.168.1.0/24, 100.101.102.103]
# For a shared TV: show "Who's watching?" on those networks instead, and start
# it on auto_sign_in_user. Profiles with a PIN still ask for it, and an admin's
# profile asks for its PIN or password.
#auto_sign_in_picker: true

# Names the server answers to besides IP addresses and localhost (DNS rebinding
# protection). Add a Tailscale MagicDNS or local name if you open VCRX by name.
#allowed_hosts: [vcrx.local]

# Behind a reverse proxy (deploy/caddy, docs/INTERNET-ACCESS.md): list the
# proxy's own address, and only that. Its X-Forwarded-For then names the
# client. A proxy NOT listed here makes every visitor "unknown" (no LAN rights,
# no sign-in without a password) and logs a warning, so a missing entry fails
# safe. Never list 0.0.0.0/0 (refused at start) or a whole LAN range.
#trusted_proxies: [127.0.0.1, "::1"]
#allowed_hosts: [watch.example.com]

# Video a client cannot decode is transcoded to H.264 on the CPU, and 4K is
# often slower than real time, so a transcode is capped at 1080p: the picture
# fits inside 1920x1080, keeping its shape, never scaled up. The cap is a height
# in a 16:9 box (720 is 1280x720, 2160 is 3840x2160); 0 removes it. Direct play
# and remux copy the video and keep the source's size. VCRX_MAX_TRANSCODE_HEIGHT
# in .env wins over this.
#max_transcode_height: 1080

# Which playback events go to the webhooks in VCRX_WEBHOOK_URLS (the URLs carry
# tokens, so they live in .env, not here). Default: all of them.
#webhook_events: [play, stop, refused, terminated, added]

# IMDb ratings for overlays and details, from IMDb's public ratings file,
# downloaded once a day. IMDb licenses it for personal, non-commercial use.
#imdb_ratings: true

# Skip Intro and Skip Credits: intros and end credits are found from each TV
# season's audio, in the background, one season at a time at low priority, and
# only in these hours of local time (set TZ in .env). Off: detect_markers: false.
#detect_markers: true
#marker_hours: "01:00-06:00"   # or "always"
#marker_intro_minutes: 10      # how much of the start of each episode is compared
#marker_credits_minutes: 8     # and of the end

# Subtitles from OpenSubtitles, when VCRX_OPENSUBTITLES_API_KEY is set in .env:
# the languages searched by default, and whether to fetch them for new files
# that have none (once per file; off by default).
#subtitle_languages: [en]
#subtitle_auto_fetch: true

# Trailers from local files (Movie-trailer.mkv, a Trailers folder) always work,
# offline. With a TMDb key, this also offers each title's official YouTube
# trailer when there is no local one; playing it needs the internet.
#trailers_youtube: true

# Before a movie: a folder of short clips (mp4, m4v, mkv, mov, webm), mounted
# read-only in compose.yaml (VCRX_PREROLL_DIR). A profile that turns on the
# pre-roll in its playback settings sees one at random before each movie.
#preroll_dir: /media/Pre-Roll

# Live TV: channels from M3U playlists you have the right to watch. VCRX ships
# no playlist and suggests none. m3u is an http(s) URL or an absolute path to a
# file; a URL with an account's password in it goes in a file of its own
# (m3u_url_file), never here. Playlists are read at startup and every
# refresh_hours (12). Viewers need the Live TV grant (Settings > Users);
# admins always have it. xmltv is the playlist's guide, optional, a URL or a
# file, gzipped or not (xmltv_url_file for a URL with a key in it), read every
# guide_refresh_hours (6) and matched to channels by tvg-id, else by name. A
# playlist's own x-tvg-url is never followed: set the guide here.
# Watching: one pull per channel, shared by everyone watching it, at most
# max_streams (4) channels at once; a source's own max_streams is its
# provider's connection limit. A playlist from the internet may only name
# streams on public addresses.
#live_tv:
#  refresh_hours: 12
#  guide_refresh_hours: 6
#  max_streams: 4
#  sources:
#    - name: My playlist
#      m3u: /config/channels.m3u
#      xmltv: /config/guide.xml.gz
#    - name: My provider
#      m3u_url_file: /config/provider-url.txt
#      xmltv_url_file: /config/provider-guide-url.txt
#      max_streams: 2

# Radarr and Sonarr webhooks find the folder by name in a library. If they see
# the NAS at another path and folder names differ, map their prefix to VCRX's.
#arr_path_map:
#  - { from: /volume1/data/media/movies, to: /media/Movies }

libraries:
  - name: Movies
    kind: movie
    path: /media/Movies
    # folder: only files sharing a folder and name prefix become versions of one
    # movie. title_year: also merge files whose parsed title and year match.
    grouping: folder
    scan_interval_minutes: 60
    # Badges drawn onto posters, like Kometa overlays. Every client shows them.
    #overlays:
    #  - { type: rating, position: top_left, sources: [imdb] }
    #  - { type: resolution, position: bottom_right }   # 4K only unless resolutions: [...]
  - name: TV
    kind: show
    path: /media/TV
    scan_interval_minutes: 60
    #overlays:
    #  - { type: ribbon }   # TOP RATED: IMDb 8.0+ with 25,000+ votes; min_rating, min_votes, text
  # Music: mount the folder read-only in compose.yaml first, for example
  # /mnt/media/Music:/media/Music:ro. Live show folders (a date in the name plus
  # an info .txt, an .ffp or .md5, or a source such as sbd) become live albums.
  #- name: Music
  #  kind: music
  #  path: /media/Music
  #  scan_interval_minutes: 60

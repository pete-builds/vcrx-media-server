# VCRX settings file, read from /config/vcrx.yaml. Environment variables win.
# Libraries listed here are created or updated by name at startup; libraries you
# add with `vcrx library add` are left alone.
server_name: VCRX

# Sign in without a password from your own networks: clients on trusted_networks
# (default: loopback, private LAN ranges and Tailscale) become this user. Anyone
# who can reach the server from those networks gets that user's access, so leave
# it off on a network you share.
#auto_sign_in_user: admin
#trusted_networks: [192.168.1.0/24, 100.64.0.0/10]

# Which playback events go to the webhooks in VCRX_WEBHOOK_URLS (the URLs carry
# tokens, so they live in .env, not here). Default: all of them.
#webhook_events: [play, stop, refused, terminated]

libraries:
  - name: Movies
    kind: movie
    path: /media/Movies
    # folder: only files sharing a folder and name prefix become versions of one
    # movie. title_year: also merge files whose parsed title and year match.
    grouping: folder
    scan_interval_minutes: 60
  - name: TV
    kind: show
    path: /media/TV
    scan_interval_minutes: 60

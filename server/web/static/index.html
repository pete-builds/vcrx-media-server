<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#000000">
<title>VCRX</title>
<link rel="icon" type="image/png" href="img/icon-64.png">

<link rel="stylesheet" href="css/app.css">

<body>

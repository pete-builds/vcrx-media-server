openapi: 3.1.0
info:
  title: VCRX Media Server API
  version: "1"
  summary: Self-hosted, offline-first media server.
  description: |
    Every route lives under /api/v1 except the health checks. JSON field names are
    snake_case. Timestamps are unix milliseconds; positions and durations are
    milliseconds. Authenticate with `Authorization: Bearer <token>` from
    POST /api/v1/auth/login, on every request including images, streams and
    subtitles. Errors are `{"error": "<code>", "message": "<human text>"}`.

    The routes in this file and the routes the server registers are compared by a
    test; adding one without the other fails CI.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://192.168.1.20:3750
    description: nix1 on the LAN
security:
  - bearer: []
  - cookie: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness. 200 while the process is serving.
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness. 503 when the database or a library root is unreachable.
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Not ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document.
      security: []
      responses:
        "200": { description: The spec, content: { application/yaml: {} } }

  /api/v1/server:
    get:
      operationId: getServerInfo
      summary: Public server identity, used by clients to confirm they found a VCRX server.
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServerInfo" } } } }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange a username and password for a bearer token. Rate limited per IP and username.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/auto:
    post:
      operationId: autoLogin
      summary: >-
        Sign in without a password, as the server's configured user, from a trusted network (LAN or
        Tailscale by default). Off unless the server sets auto_sign_in_user. GET /api/v1/server tells a
        client whether this works from where it is.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutoLoginRequest" } } }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/hooks/arr:
    post:
      operationId: arrWebhook
      summary: >-
        Radarr and Sonarr Webhook connection target. Scans the movie or series folder named in an import, upgrade,
        rename or delete, within seconds rather than at the next scheduled scan. LAN only, and needs the server's
        VCRX_ARR_WEBHOOK_TOKEN as ?token=, an X-VCRX-Token header, or the basic-auth password. Off (404) without one.
      security: []
      parameters:
        - { name: token, in: query, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: "The Radarr or Sonarr webhook body, unchanged." } } }
      responses:
        "200": { description: A test or an event that changes no files. }
        "202":
          description: Scan started, or queued behind a running scan.
          content:
            application/json:
              schema:
                type: object
                required: [action]
                properties:
                  action: { type: string, enum: [scanned, queued, ignored, test] }
                  library_id: { type: integer }
                  path: { type: string }
                  scan_id: { type: integer }
                  reason: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the token used for this request.
      responses:
        "204": { description: Logged out }
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me/playback-settings:
    get:
      operationId: getPlaybackSettings
      summary: The signed-in user's own playback choices, kept on the server so every client (web, TV) shares them.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackSettings" } } } }
    put:
      operationId: setPlaybackSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackSettings" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/home:
    get:
      operationId: getHome
      summary: Rows for the TV home screen, already filtered by the caller's access.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: { type: array, items: { $ref: "#/components/schemas/HomeRow" } }
  /api/v1/rows/{row_id}:
    get:
      operationId: getHomeRow
      summary: >-
        A Home row's See all view: the row with up to 100 titles, under the caller's access. row_id is a HomeRow id
        from /api/v1/home, such as top_rated_movies, genre:Comedy or seasonal:halloween. Continue Watching has none.
      parameters:
        - { name: row_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HomeRow" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/layout/home:
    get:
      operationId: getHomeLayout
      summary: >-
        The caller's Home layout: every row slot in order with whether it shows. The caller's own choice, else the
        server default, else the built-in order. The web and TV Customize Home editors both read and write this.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayout" } } } }
    put:
      operationId: setHomeLayout
      summary: Save the caller's own Home layout. Slots left out keep their default and go last.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayoutInput" } } }
      responses:
        "200": { description: The layout as saved, content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayout" } } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: resetHomeLayout
      summary: Forget the caller's own layout, so the server default applies again.
      responses:
        "200": { description: The layout now in effect, content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayout" } } } }

  /api/v1/libraries:
    get:
      operationId: listLibraries
      summary: Libraries the caller may see.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries: { type: array, items: { $ref: "#/components/schemas/Library" } }
  /api/v1/libraries/{library_id}/items:
    get:
      operationId: listLibraryItems
      summary: Top-level items of a library (movies, or shows).
      parameters:
        - { name: library_id, in: path, required: true, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year], default: title } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: genre, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: decade, in: query, schema: { type: integer }, description: "First year of a decade: 1990 for 1990 to 1999." }
        - { name: resolution, in: query, schema: { $ref: "#/components/schemas/Resolution" } }
        - { name: unwatched, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemPage" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/libraries/{library_id}/collections:
    get:
      operationId: listLibraryCollections
      summary: >-
        The library's collections in name order, counting only members the caller may see. Franchise collections are built
        automatically from TMDb collections with two or more films in the library, names from TMDb.
      parameters:
        - { name: library_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections: { type: array, items: { $ref: "#/components/schemas/Collection" } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/libraries/{library_id}/filters:
    get:
      operationId: getLibraryFilters
      summary: Genres and decades of the library's visible titles, with counts, for genre= and decade= on the items list.
      parameters:
        - { name: library_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [genres, decades]
                properties:
                  genres: { type: array, items: { $ref: "#/components/schemas/FilterCount" } }
                  decades: { type: array, items: { $ref: "#/components/schemas/FilterCount" }, description: "Values like 1990s, newest first." }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/collections/{collection_id}:
    get:
      operationId: getCollection
      summary: A collection and its members in order (release order for a franchise).
      parameters:
        - { name: collection_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [collection, items]
                properties:
                  collection: { $ref: "#/components/schemas/Collection" }
                  items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/search:
    get:
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Movies, shows and episodes whose title matches, best first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }

  /api/v1/items/{item_id}:
    get:
      operationId: getItem
      parameters: [{ $ref: "#/components/parameters/ItemID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/items/{item_id}/children:
    get:
      operationId: getItemChildren
      summary: Seasons of a show, or episodes of a season, in order.
      parameters: [{ $ref: "#/components/parameters/ItemID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/items/{item_id}/watched:
    put:
      operationId: setWatched
      summary: Mark watched or unwatched. On a show or season this applies to every episode.
      parameters: [{ $ref: "#/components/parameters/ItemID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [played]
              properties:
                played: { type: boolean }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/items/{item_id}/progress:
    delete:
      operationId: clearProgress
      summary: >-
        Remove from Continue Watching: forget the caller's resume position without marking the item played or changing its
        play count. On a show or season this applies to every episode. Only the caller's own watch state changes.
      parameters: [{ $ref: "#/components/parameters/ItemID" }]
      responses:
        "204": { description: Cleared }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/items/{item_id}/artwork/{kind}:
    get:
      operationId: getArtwork
      summary: A JPEG of the item's artwork, resized to fit width. 404 when there is none; clients draw a placeholder.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, thumb] } }
        - { name: width, in: query, schema: { type: integer, minimum: 32, maximum: 3840 } }
      responses:
        "200": { description: Image, content: { image/jpeg: {} } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/playback/sessions:
    post:
      operationId: startPlayback
      summary: |
        Ask to play an item. The server picks a version the caller may see, compares it
        with the device's capabilities, records the decision and its reason, and
        returns where to stream from. A policy refusal is 403 and a file this server
        cannot yet adapt for the device is 422; both carry a message to show on screen
        and are still recorded in the activity history. A client that reports
        fmp4_stream gets files it cannot play directly as a converted stream (protocol
        fmp4): video copied, or transcoded to H.264 when the device cannot decode it
        (decision transcode; needs an ffmpeg with libx264 and a client that decodes
        H.264). A client that reports hls_stream (Safari) gets the same conversion as
        HLS instead (protocol hls), and gets HLS when it reports both. Any other client
        is refused with transcode_unavailable when its video needs converting.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackRequest" } } }
      responses:
        "201": { description: Session created, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackSession" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/playback/sessions/{session_id}/events:
    post:
      operationId: postPlaybackEvent
      summary: |
        Report what the player did. Send start once playing, progress every
        heartbeat_interval_ms while playing, pause, resume, seek (with
        from_position_ms), buffering, error, and stop. Progress and stop update the
        caller's resume position; a stop past 90% marks the item played.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackEvent" } } }
      responses:
        "204": { description: Recorded }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/playback/sessions/{session_id}/seek:
    get:
      operationId: seekConvertedStream
      summary: >-
        For a session with protocol fmp4 or hls: where a stream asked for at position_ms starts and the URL to play.
        When the video is copied that is the keyframe at or before position_ms, since copied video starts only on
        one; when it is transcoded (decision transcode) it is position_ms itself. The player's position is start_ms
        plus the media element's own time. For hls this also starts the stream, replacing the one the session had
        (whose URLs then answer 404), and url is its playlist; audio picks the track by its stream index, and 503
        (busy) means no conversion slot is free, as on the fmp4 stream.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: position_ms, in: query, schema: { type: integer, minimum: 0 } }
        - { name: audio, in: query, schema: { type: integer }, description: For hls only; fmp4 takes it on the stream URL. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [start_ms, url]
                properties:
                  start_ms: { type: integer }
                  url: { type: string, description: Path relative to the server base URL. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playback/sessions/{session_id}/hls/{run}/index.m3u8:
    get:
      operationId: getHLSPlaylist
      summary: >-
        For a session with protocol hls: the playlist of the stream the seek endpoint started, as an HLS EVENT
        playlist of fragmented MP4 segments (about 4 s each; copied video is cut on its own keyframes) that grows
        as the server converts, with EXT-X-ENDLIST once the file is done. Time 0 is the seek's start_ms. Waits for
        three segments (or the end of a shorter file), since a player starts a growing playlist no closer than three
        segments from its end. Only the session's owner gets it, and only while the session is open (409 once it has
        ended, 410 when stopped from Activity). 404 once a seek has replaced the stream, and after two minutes in
        which nothing of it was requested, when the server deletes it: seek again.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: run, in: path, required: true, schema: { type: string }, description: The stream's id, from the seek endpoint's url. }
      responses:
        "200": { description: The playlist, content: { application/vnd.apple.mpegurl: {} } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    head:
      operationId: headHLSPlaylist
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: run, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The stream exists }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/playback/sessions/{session_id}/hls/{run}/{segment}:
    get:
      operationId: getHLSSegment
      summary: >-
        A segment the playlist names: init.mp4 or segNNNNN.m4s, nothing else. The same access rules as the
        playlist. Segments well behind the player are deleted to bound disk use, so asking for one again is 404;
        seek instead. Supports Range.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: run, in: path, required: true, schema: { type: string } }
        - { name: segment, in: path, required: true, schema: { type: string, pattern: '^(init\.mp4|seg[0-9]{5,9}\.m4s)$' } }
      responses:
        "200": { description: Fragmented MP4, content: { video/mp4: {} } }
        "206": { description: Partial content }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/playback/sessions/{session_id}/stream.mp4:
    get:
      operationId: getConvertedStream
      summary: >-
        The file as fragmented MP4 from start_ms: video copied, or for a transcode session re-encoded to H.264
        (High profile, 8-bit 4:2:0, scaled down to fit the device's reported size and never up, a keyframe every
        2 s, HDR tone mapped to SDR for a device that reports no HDR when ffmpeg has zscale); audio copied when the
        device decodes a track MP4 can carry, otherwise the default track converted to stereo AAC. Not seekable by
        byte range; seek by asking the seek endpoint for a new stream. audio picks a track by its stream index. 503
        (busy) when the server is already running as many converted streams, or as many transcodes
        (VCRX_MAX_TRANSCODES, default 2), as it allows.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: start_ms, in: query, schema: { type: integer, minimum: 0 } }
        - { name: audio, in: query, schema: { type: integer } }
      responses:
        "200": { description: Fragmented MP4, content: { video/mp4: {} } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    head:
      operationId: headConvertedStream
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The stream exists }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{version_id}/file:
    get:
      operationId: streamVersion
      summary: |
        The media file itself, for direct play. Supports Range, If-Range and HEAD.
        Access is checked on every request against the caller's policy.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: integer } }
        - { name: session, in: query, schema: { type: string }, description: Playback session id, for activity accounting. }
      responses:
        "200": { description: Whole file }
        "206": { description: Partial content }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416": { description: Range not satisfiable }
    head:
      operationId: headVersion
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Headers only }
  /api/v1/extras/{extra_id}/file:
    get:
      operationId: streamExtra
      summary: |
        An extra's file: a trailer or featurette for direct play (the stream URL of a
        session started with extra_id), or a show's theme music (theme_music.url, no
        session). Supports Range, If-Range and HEAD. Access is the item's: 404 for a
        caller who cannot see the movie or show it belongs to.
      parameters:
        - { name: extra_id, in: path, required: true, schema: { type: integer } }
        - { name: session, in: query, schema: { type: string }, description: Playback session id, for activity accounting. }
      responses:
        "200": { description: Whole file }
        "206": { description: Partial content }
        "404": { $ref: "#/components/responses/Error" }
        "416": { description: Range not satisfiable }
    head:
      operationId: headExtra
      parameters:
        - { name: extra_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Headers only }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/subtitles/{stream_id}:
    get:
      operationId: getSubtitle
      summary: >-
        A subtitle track. Without format, a sidecar file served as-is with its text MIME type. With format=vtt, any
        text track (sidecar or embedded) as WebVTT. An embedded track is read out of the media file in one background
        pass for all its text tracks; until that finishes the answer is 202 with Retry-After.
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: integer } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [vtt] } }
      responses:
        "200": { description: Subtitle text }
        "202":
          description: Still extracting; retry after the Retry-After seconds.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, enum: [preparing] }
                  message: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{version_id}/subtitles/search:
    get:
      operationId: searchSubtitles
      summary: >-
        Search OpenSubtitles for subtitles for this file: by the file's OpenSubtitles hash first, then by the IMDb or
        TMDb id (the show's, with season and episode, for an episode), then by title and year only when the ids found
        nothing. Ranked: hash matches, then trusted uploaders, then the hearing-impaired preference, then download count.
        Any signed-in user who may play the version. 404 search_off when no API key is configured; 503 when
        OpenSubtitles cannot be reached; 429 rate_limited (with Retry-After). Admins also get the download quota.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: integer } }
        - name: languages
          in: query
          schema: { type: string }
          description: Comma separated, as ISO 639-1 or 639-2 codes or English names (en,eng,English). Default the server's subtitle_languages.
        - { name: hearing_impaired, in: query, schema: { type: boolean }, description: Rank hearing-impaired files first. Default false. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [results, can_download]
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/SubtitleHit" } }
                  can_download: { type: boolean, description: Whether the caller may download one of them. }
                  quota: { $ref: "#/components/schemas/SubtitleQuota" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{version_id}/subtitles/download:
    post:
      operationId: downloadSubtitle
      summary: >-
        Download one file a search just offered for this version and add it as an external subtitle track every client
        sees. Stored in the server's data directory, never beside the media. Admins, and users whose policy has
        allow_subtitle_download. Downloading a file the version already has is free and answers 200. 409 search_again
        when the file was not in a search for this version in the last hour; 429 quota_exhausted when today's
        OpenSubtitles downloads are used up.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { type: integer }
      responses:
        "201": { description: Downloaded, content: { application/json: { schema: { $ref: "#/components/schemas/SubtitleDownloadResult" } } } }
        "200": { description: Already downloaded, content: { application/json: { schema: { $ref: "#/components/schemas/SubtitleDownloadResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{version_id}/subtitle-offset:
    put:
      operationId: setSubtitleOffset
      summary: >-
        The caller's subtitle delay for this file, kept on the server. Positive shows subtitles later. WebVTT answers
        (format=vtt) are shifted by it from then on; playback sessions report it as subtitle_offset_ms. 0 clears it.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_ms]
              properties:
                offset_ms: { type: integer, minimum: -600000, maximum: 600000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { type: object, required: [offset_ms], properties: { offset_ms: { type: integer } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/speedtest:
    get:
      operationId: speedTest
      summary: >-
        Filler bytes for a client to time its connection to the server (the TV app's Settings > About speed test).
        Random, so a compressing proxy cannot flatter the result. Reads nothing from the library.
      parameters:
        - { name: bytes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 64000000, default: 8000000 } }
      responses:
        "200": { description: The bytes asked for, application/octet-stream }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/admin/libraries:
    get:
      operationId: adminListLibraries
      summary: All libraries with root paths and their last scan. Admin and LAN only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries: { type: array, items: { $ref: "#/components/schemas/AdminLibrary" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateLibrary
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminLibrary" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/libraries/{library_id}/scan:
    post:
      operationId: adminScanLibrary
      summary: Start a scan, optionally limited to one folder under the library root.
      parameters:
        - { name: library_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: Folder relative to the library root. }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ScanRun" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/scans:
    get:
      operationId: adminListScans
      parameters:
        - { name: library_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [scans]
                properties:
                  scans: { type: array, items: { $ref: "#/components/schemas/ScanRun" } }
  /api/v1/admin/collections:
    get:
      operationId: adminSmartCollections
      summary: Smart collection definitions loaded from YAML and the last build of each
      description: >-
        Lists every YAML file in the collections directory, whether it loaded or
        was refused (with the file and line of the error), and each definition's
        last build: matching titles, its label and where it is visible. A refused
        file's collections keep building from its last good load (last_good).
        built is false until the first build after startup.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [built, files, collections]
                properties:
                  built: { type: boolean }
                  dir: { type: string }
                  built_at: { type: integer, description: Unix milliseconds. }
                  error: { type: string, description: Set when the directory could not be read; nothing was changed. }
                  labels_added: { type: integer }
                  labels_removed: { type: integer }
                  collections_removed: { type: integer }
                  files:
                    type: array
                    items:
                      type: object
                      required: [file, collections, last_good]
                      properties:
                        file: { type: string }
                        error: { type: string }
                        collections: { type: integer }
                        last_good: { type: boolean }
                  collections:
                    type: array
                    items:
                      type: object
                      required: [file, line, name, library, slug, visible, items, last_good]
                      properties:
                        file: { type: string }
                        line: { type: integer }
                        name: { type: string }
                        library: { type: string }
                        slug: { type: string }
                        label: { type: string }
                        visible:
                          type: object
                          properties:
                            library: { type: boolean }
                            home: { type: boolean }
                            shared: { type: boolean }
                        items: { type: integer }
                        last_good: { type: boolean }
                        error: { type: string }
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
    post:
      operationId: adminCreateUser
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user_id}/grants:
    put:
      operationId: adminSetGrants
      summary: Replace the set of libraries a user may see.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library_ids]
              properties:
                library_ids: { type: array, items: { type: integer } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user_id}/policy:
    put:
      operationId: adminSetPolicy
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserPolicy" } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/layout/home:
    get:
      operationId: adminGetHomeLayout
      summary: The server default Home layout, for everyone without their own.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayout" } } } }
    put:
      operationId: adminSetHomeLayout
      summary: Set the server default Home layout.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayoutInput" } } }
      responses:
        "200": { description: The default as saved, content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayout" } } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: adminResetHomeLayout
      summary: Forget the server default, so the built-in order applies.
      responses:
        "200": { description: The default now in effect, content: { application/json: { schema: { $ref: "#/components/schemas/HomeLayout" } } } }
  /api/v1/admin/labels:
    get:
      operationId: adminListLabels
      summary: Labels on titles with how many carry each, most used first, for policy allow and deny lists.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items:
                      type: object
                      required: [name, hidden, item_count]
                      properties:
                        name: { type: string }
                        hidden: { type: boolean }
                        item_count: { type: integer }
  /api/v1/admin/activity/sessions:
    get:
      operationId: adminListPlaybackSessions
      summary: Playback history, newest first. active=true returns only sessions still open.
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/ActivitySession" } }

  /api/v1/admin/metadata/unmatched:
    get:
      operationId: adminUnmatched
      summary: Movies and shows TMDb matching left alone, with the reason, for Fix Match. 404 tmdb_off without a TMDb key.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unmatched]
                properties:
                  unmatched:
                    type: array
                    items:
                      type: object
                      required: [id, kind, title, year, reason]
                      properties:
                        id: { type: integer }
                        kind: { type: string, enum: [movie, show] }
                        title: { type: string }
                        year: { type: integer, description: 0 when the file name has none. }
                        reason: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/items/{item_id}/match:
    get:
      operationId: adminMatchSearch
      summary: TMDb results for a movie or show (the item's own title when query is empty), to pick the right one.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: query, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [choices]
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      required: [tmdb_id, title, year]
                      properties:
                        tmdb_id: { type: integer }
                        title: { type: string }
                        year: { type: integer }
                        overview: { type: string }
                        popularity: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    put:
      operationId: adminMatchSet
      summary: >-
        Fix Match: set the TMDb id by hand and fill the item from it now. Later enrichment passes keep the choice.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdb_id]
              properties:
                tmdb_id: { type: integer }
      responses:
        "200":
          description: Matched
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched: { type: boolean }
                  episodes: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/admin/items/{item_id}/history:
    get:
      operationId: adminItemHistory
      summary: >-
        One title's plays, newest first, like Tautulli's item page: who, when, device, how far, decision, plus totals over
        every play. A show includes its episodes. Same plays as /admin/activity/history?item_id. Admin and LAN only.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [item_id, kind, sessions, plays, users, watch_ms]
                properties:
                  item_id: { type: integer }
                  kind: { type: string, enum: [movie, show, episode] }
                  sessions: { type: array, items: { $ref: "#/components/schemas/ActivityEntry" } }
                  plays: { type: integer, description: Every play of the title, not only this page. }
                  users: { type: integer, description: People who played it. }
                  watch_ms: { type: integer, description: Wall time spent playing it, summed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/watch/export:
    get:
      operationId: adminWatchExport
      summary: >-
        Every movie and show still on disk with its files, size and watch state across all users, for a cleanup tool
        deciding what to delete. Shows are rolled up from their episodes. Ordered by library, then title. The body is
        streamed and its closing bracket is written last, so a cut-off response does not parse. Admin and LAN only.
      parameters:
        - { name: library_id, in: query, schema: { type: integer, minimum: 1 } }
        - name: unplayed_days
          in: query
          schema: { type: integer, minimum: 0 }
          description: Only titles nobody has played in this many days, titles never played included. 0 or absent means no filter.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, items, count]
                properties:
                  generated_at: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/TitleWatch" } }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/items/{item_id}/merge:
    post:
      operationId: adminMergeItems
      summary: >-
        Merge other movies of the same library into this one. Their files become its versions; watch state is combined per
        user, playback history and collections move over, and this movie keeps its own title and match. Rescans keep the
        merge. Movies whose content ratings or labels (set by hand or by an NFO) differ are refused with 422
        access_differs, since access rules judge a movie by them. One transaction: on any error nothing changes. 409
        scan_running while the library is being scanned.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids: { type: array, items: { type: integer }, description: The movies to fold into this one. }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                type: object
                required: [item_id]
                properties:
                  item_id: { type: integer, description: The merged movie, the one in the path. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/admin/versions/{version_id}/split:
    post:
      operationId: adminSplitVersion
      summary: >-
        Move one version out of its movie into a movie of its own, a copy of the old one's metadata and match. The split
        is kept by rescans and by the automatic merge of copies with the same TMDb id. One transaction: on any error
        nothing changes. 422 only_version for a movie's only file; 409 scan_running while the library is being scanned.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Split
          content:
            application/json:
              schema:
                type: object
                required: [item_id]
                properties:
                  item_id: { type: integer, description: The new movie holding the version. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/admin/markers:
    get:
      operationId: adminMarkerStatus
      summary: >-
        Intro and credits detection over the whole TV library: whether it is on, its hours, seasons and episodes
        done, markers found, per-show progress and the latest files that could not be read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, hours, in_window, seasons_total, seasons_done, episodes_total, episodes_done, intros, credits, errors, shows, recent_errors]
                properties:
                  enabled: { type: boolean }
                  hours: { type: string, description: "Local time window, e.g. 01:00-06:00, or always." }
                  in_window: { type: boolean }
                  seasons_total: { type: integer }
                  seasons_done: { type: integer, description: Seasons whose every episode has been looked at in its current file. }
                  episodes_total: { type: integer }
                  episodes_done: { type: integer }
                  intros: { type: integer }
                  credits: { type: integer }
                  errors: { type: integer }
                  shows:
                    type: array
                    items:
                      type: object
                      required: [show_id, title, seasons_total, seasons_done, episodes_total, episodes_done, intros, credits, errors]
                      properties:
                        show_id: { type: integer }
                        title: { type: string }
                        seasons_total: { type: integer }
                        seasons_done: { type: integer }
                        episodes_total: { type: integer }
                        episodes_done: { type: integer }
                        intros: { type: integer }
                        credits: { type: integer }
                        errors: { type: integer }
                  recent_errors:
                    type: array
                    items:
                      type: object
                      required: [item_id, show_title, season_number, episode_number, error, checked_at]
                      properties:
                        item_id: { type: integer }
                        show_title: { type: string }
                        season_number: { type: [integer, "null"] }
                        episode_number: { type: [integer, "null"] }
                        error: { type: string }
                        checked_at: { type: integer }
  /api/v1/admin/items/{item_id}/markers/detect:
    post:
      operationId: adminDetectMarkers
      summary: >-
        Detect intros and credits again for a show, a season or an episode's season, now, whatever the hour (still
        one season at a time at low priority). Markers an admin set or cleared are kept.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
      responses:
        "202":
          description: Queued
          content: { application/json: { schema: { type: object, required: [seasons], properties: { seasons: { type: integer } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/admin/items/{item_id}/markers/{kind}:
    put:
      operationId: adminSetMarker
      summary: Set an episode's (or movie's) intro or credits by hand. Detection never replaces it.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [intro, credits] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_ms, end_ms]
              properties:
                start_ms: { type: integer, minimum: 0 }
                end_ms: { type: integer, description: After start_ms and not past the end of the file. }
      responses:
        "200": { description: The item's markers now, content: { application/json: { schema: { $ref: "#/components/schemas/MarkerList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: adminClearMarker
      summary: Remove an intro or credits marker and keep it removed (detection will not add it back).
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [intro, credits] } }
      responses:
        "200": { description: The item's markers now, content: { application/json: { schema: { $ref: "#/components/schemas/MarkerList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/items/{item_id}/markers/{kind}/apply-to-season:
    post:
      operationId: adminApplyMarkerToSeason
      summary: >-
        Copy this episode's marker to the rest of its season by finding the same audio in each episode. Episodes
        where it is not found, and markers an admin set by hand, are left alone. Runs in the background now.
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [intro, credits] } }
      responses:
        "202": { description: Queued }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/admin/activity/now:
    get:
      operationId: adminActivityNow
      summary: Every open playback session with progress, device, decision and bitrate, plus header totals. Admin and LAN only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions, stream_count, direct_play, converting, bandwidth_bps]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/ActivityEntry" } }
                  stream_count: { type: integer }
                  direct_play: { type: integer }
                  converting: { type: integer }
                  bandwidth_bps: { type: integer, description: Sum of the bitrates of sessions that are not paused. }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/activity/history:
    get:
      operationId: adminActivityHistory
      summary: Ended sessions, newest first. Refusals and sessions that never played are left out unless include_refused is true.
      parameters:
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: item_id, in: query, schema: { type: integer }, description: "A movie, an episode, or a show (all its episodes)." }
        - { name: include_refused, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions, total]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/ActivityEntry" } }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/activity/stats:
    get:
      operationId: adminActivityStats
      summary: >-
        Totals over the last days days (default 30): plays and watch time, top movies, shows, users, clients and devices,
        and plays by day, hour and weekday in the server's time zone. A play counts once 30 seconds have actually played.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, maximum: 3650 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityStats" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/activity/users:
    get:
      operationId: adminActivityUsers
      summary: Every account with all-time plays and watch time and its latest session.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [user_id, username, is_admin, plays, watch_ms]
                      properties:
                        user_id: { type: integer }
                        username: { type: string }
                        is_admin: { type: boolean }
                        plays: { type: integer }
                        watch_ms: { type: integer }
                        last_seen: { type: [integer, "null"] }
                        last_title: { type: [string, "null"] }
                        last_device: { type: [string, "null"] }
                        last_ip: { type: [string, "null"] }
                        last_location: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/activity/sessions/{session_id}/terminate:
    post:
      operationId: adminTerminateSession
      summary: >-
        Stop someone's stream. Open file responses for the session are cut off, and its stream URL and events then answer
        410 session_terminated with the message, which clients show to the viewer.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 200, description: Shown to the viewer. A default is used when empty. }
      responses:
        "200":
          description: The session as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityEntry" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/items/{item_id}/subtitles:
    get:
      operationId: adminItemSubtitles
      summary: Subtitles downloaded from OpenSubtitles for a movie's or episode's versions, and the account's download quota. Admin and LAN only.
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, can_download, subtitles, quota]
                properties:
                  enabled: { type: boolean }
                  can_download: { type: boolean }
                  subtitles:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/DownloadedSubtitle" }
                        - type: object
                          properties:
                            created_at: { type: integer }
                            downloaded_by: { type: [string, "null"], description: Null for the automatic fetch or a deleted user. }
                  quota: { oneOf: [{ $ref: "#/components/schemas/SubtitleQuota" }, { type: "null" }] }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subtitles/{stream_id}:
    delete:
      operationId: adminDeleteSubtitle
      summary: Delete a downloaded subtitle (its track and its file). Sidecar files and embedded tracks are never deleted. Admin and LAN only.
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/newsletter:
    get:
      operationId: adminNewsletter
      summary: >-
        The weekly newsletter's settings and state: a digest of the movies and episodes added in the last 7 days,
        posted through the webhooks at a weekday and hour in the server's time zone. Off by default.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsletterStatus" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: adminSetNewsletter
      summary: >-
        Switch the newsletter on or off, set when it goes out and whose view it uses. A change takes effect from the
        next scheduled time; it never sends a past week's digest straight away. 400 when the audience is an admin,
        disabled or missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterSettings" }
      responses:
        "200":
          description: The settings and state as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsletterStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/newsletter/preview:
    post:
      operationId: adminPreviewNewsletter
      summary: >-
        Send the last 7 days' digest to every webhook now, marked as a preview. Works while the newsletter is off and
        does not count as the week's send. Built under the audience setting, like the weekly one. 409 no_webhooks when
        no webhook takes the newsletter event, 409 bad_audience when the audience account is no longer valid,
        409 nothing_added when the audience has nothing new, 502 webhook_failed when no webhook accepted it.
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed, movies, shows, episodes]
                properties:
                  sent: { type: integer, description: Webhooks that accepted it. }
                  failed: { type: integer }
                  movies: { type: integer }
                  shows: { type: integer }
                  episodes: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque token from POST /api/v1/auth/login.
    cookie:
      type: apiKey
      in: cookie
      name: vcrx_session
      description: >-
        The same token in an HttpOnly cookie, set when login asks for it. Used by the web app, whose video,
        track and image requests cannot carry a header. Requests other than GET and HEAD must also send
        X-VCRX-Client, which a cross-site page cannot.
  parameters:
    ItemID: { name: item_id, in: path, required: true, schema: { type: integer } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Stable machine code, e.g. unauthorized, not_found, playback_refused, transcode_unavailable. }
        message: { type: string, description: Short text safe to show on a TV. }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks: { type: object, additionalProperties: { type: string } }
    ServerInfo:
      type: object
      required: [name, product, version, api_version]
      properties:
        name: { type: string, description: Friendly server name from config. }
        product: { type: string, const: vcrx-media-server }
        version: { type: string }
        api_version: { type: integer, const: 1 }
        auto_sign_in: { type: boolean, description: "True when this client may sign in without a password (POST /api/v1/auth/auto)." }
        trailers_youtube: { type: boolean, description: "True when the admin turned on YouTube trailers (trailers_youtube, with a TMDb key): details may carry a trailer with source youtube." }
    AutoLoginRequest:
      type: object
      required: [device]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        cookie: { type: boolean, description: "Also set the HttpOnly vcrx_session cookie, for browsers. Cookie-authenticated requests that change something must send the X-VCRX-Client header." }
    Device:
      type: object
      required: [id, name, platform, client, client_version]
      properties:
        id: { type: string, description: Stable random id generated by the client on first launch. }
        name: { type: string, example: Living room TV }
        model: { type: string, example: TCL 55S546 }
        platform: { type: string, example: android_tv }
        client: { type: string, example: vcrx-tv }
        client_version: { type: string, example: 0.1.0 }
    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        device: { $ref: "#/components/schemas/Device" }
        cookie: { type: boolean, description: "Also set the HttpOnly vcrx_session cookie, for browsers. Cookie-authenticated requests that change something must send the X-VCRX-Client header." }
    LoginResponse:
      type: object
      required: [token, user, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, username, is_admin]
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: [string, "null"] }
        is_admin: { type: boolean }
    Resolution:
      type: string
      enum: [SD, 480p, 576p, 720p, 1080p, 4K, 8K]
    Library:
      type: object
      required: [id, name, kind, item_count]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [movie, show] }
        item_count: { type: integer }
    WatchState:
      type: object
      required: [position_ms, played, play_count]
      properties:
        position_ms: { type: integer }
        duration_ms: { type: [integer, "null"] }
        played: { type: boolean }
        play_count: { type: integer }
        last_played_at: { type: [integer, "null"] }
        unplayed_count: { type: [integer, "null"], description: For shows and seasons, episodes not yet played. }
    ItemSummary:
      type: object
      required: [id, kind, title, library_id, has_poster, has_backdrop, has_thumb, added_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [movie, show, season, episode] }
        library_id: { type: integer }
        title: { type: string }
        year: { type: [integer, "null"] }
        parent_id: { type: [integer, "null"] }
        show_id: { type: [integer, "null"] }
        show_title: { type: [string, "null"] }
        season_number: { type: [integer, "null"] }
        episode_number: { type: [integer, "null"] }
        episode_number_end: { type: [integer, "null"] }
        runtime_ms: { type: [integer, "null"] }
        resolution: { oneOf: [{ $ref: "#/components/schemas/Resolution" }, { type: "null" }], description: Best resolution the caller may play. }
        child_count: { type: [integer, "null"], description: Seasons in a show, episodes in a season. }
        has_poster: { type: boolean }
        has_backdrop: { type: boolean }
        has_thumb: { type: boolean }
        added_at: { type: integer }
        watch: { $ref: "#/components/schemas/WatchState" }
        note: { type: string, description: 'A short line some Home rows add to a card, such as "3 new episodes" or "Season 2 added". Absent elsewhere.' }
    Track:
      type: object
      required: [id, kind, is_default, is_forced, is_external, is_image_based]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [audio, subtitle, video] }
        index: { type: [integer, "null"], description: Stream index inside the file; null for sidecar files. }
        codec: { type: [string, "null"], description: FFprobe codec name, e.g. eac3, truehd, subrip, ass, hdmv_pgs_subtitle. }
        language: { type: [string, "null"], description: ISO 639-2 as tagged in the file. }
        title: { type: [string, "null"] }
        channels: { type: [integer, "null"] }
        is_default: { type: boolean }
        is_forced: { type: boolean }
        is_external: { type: boolean }
        is_image_based: { type: boolean }
        is_downloaded: { type: boolean, description: A subtitle the server downloaded from OpenSubtitles. }
    Version:
      type: object
      required: [id, size]
      properties:
        id: { type: integer }
        label: { type: [string, "null"], description: "Edition or source label parsed from the filename, e.g. Director's Cut, REMUX." }
        file_name: { type: string }
        container: { type: [string, "null"], description: "mkv, mp4, avi, ts, webm, ..." }
        size: { type: integer }
        bitrate: { type: [integer, "null"] }
        duration_ms: { type: [integer, "null"] }
        video_codec: { type: [string, "null"] }
        video_profile: { type: [string, "null"] }
        bit_depth: { type: [integer, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        resolution: { oneOf: [{ $ref: "#/components/schemas/Resolution" }, { type: "null" }] }
        hdr_type: { type: [string, "null"], enum: [hdr10, hdr10plus, hlg, dolby_vision, null] }
        audio_tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
        subtitle_tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          properties:
            overview: { type: [string, "null"] }
            tagline: { type: [string, "null"] }
            content_rating: { type: [string, "null"] }
            genres: { type: array, items: { type: string } }
            directors: { type: array, items: { type: string } }
            studios: { type: array, items: { type: string } }
            cast:
              type: array
              description: Up to 20 actors in billing order; an episode lists its own guests before its show's cast.
              items:
                type: object
                properties:
                  name: { type: string }
                  role: { type: [string, "null"] }
            ratings: { type: object, additionalProperties: { type: number }, description: "Keyed by source: imdb, tmdb, nfo." }
            versions: { type: array, items: { $ref: "#/components/schemas/Version" }, description: Only versions the caller may play, best first. }
            collections:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: integer }
                  name: { type: string }
              description: Collections this item is in.
            markers: { type: array, items: { $ref: "#/components/schemas/Marker" }, description: "Intro and credits of a movie or episode (empty for others), intro first." }
            extras:
              type: array
              items: { $ref: "#/components/schemas/Extra" }
              description: >-
                A movie's or show's local extras (trailers first, then featurettes, behind the scenes, deleted scenes,
                interviews, scenes, shorts, other), from files beside it on disk. Empty for seasons and episodes.
                Play one with POST /api/v1/playback/sessions and extra_id.
            trailer: { oneOf: [{ $ref: "#/components/schemas/Trailer" }, { type: "null" }], description: "The trailer a Trailer button plays: a local one first, else YouTube when trailers_youtube is on. Null when there is none." }
            theme_music:
              oneOf:
                - type: object
                  required: [id, url]
                  properties:
                    id: { type: integer }
                    url: { type: string, description: Path of the MP3 relative to the server base URL. }
                - type: "null"
              description: A show's theme.mp3, for clients to play quietly on its page.
            next_episode: { oneOf: [{ $ref: "#/components/schemas/ItemSummary" }, { type: "null" }], description: "For a show or season: the episode Play should start (first unwatched, or in progress). For an episode: the one after it, for Up Next (the rest of the season, then the next; specials only after a special); null at the end of the show." }
    Extra:
      type: object
      required: [id, kind, title]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [trailer, featurette, behind_the_scenes, deleted_scene, interview, scene, short, other] }
        title: { type: string }
        duration_ms: { type: [integer, "null"] }
        container: { type: [string, "null"] }
        resolution: { oneOf: [{ $ref: "#/components/schemas/Resolution" }, { type: "null" }] }
    Trailer:
      type: object
      required: [source, title]
      properties:
        source: { type: string, enum: [local, youtube] }
        title: { type: string }
        extra_id: { type: [integer, "null"], description: "For a local trailer: play it with POST /api/v1/playback/sessions and this extra_id." }
        duration_ms: { type: [integer, "null"] }
        youtube_key:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_-]{11}$"
          description: >-
            For a YouTube trailer: the video id. The web app embeds https://www.youtube-nocookie.com/embed/<key>;
            the TV app opens vnd.youtube:<key>, else https://www.youtube.com/watch?v=<key>.
    Collection:
      type: object
      required: [id, library_id, name, item_count, poster_item_ids]
      properties:
        id: { type: integer }
        library_id: { type: integer }
        name: { type: string }
        item_count: { type: integer }
        poster_item_ids: { type: array, items: { type: integer }, description: Up to four members whose posters make the collection's artwork. }
    FilterCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    ItemPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        total: { type: integer }
    HomeRow:
      type: object
      required: [id, title, items]
      properties:
        id:
          type: string
          description: >-
            Stable for the row, and the key for its See all view: continue_watching, recently_added_movies:<library id>,
            recently_added_tv:<library id>, seasonal:<season id> (seasonal:<season id>:family for the kids' row),
            new_seasons, because_you_watched:<item id>, trending, recently_released, top_rated_movies, top_rated_shows,
            unwatched_gems, genre:<genre>, collection:<collection id>, most_watched, most_watched_by_you, rediscover,
            best_of_decade:<1990>, tmdb_trending or tmdb_popular. Clients render whatever rows come, in order.
        kind: { type: string, description: "The row's slot in the Home layout (a HomeLayoutRow key), or genre, collection or best_of_decade." }
        title: { type: string }
        library_id: { type: [integer, "null"], description: "Set on a library's Recently Added row." }
        see_all: { type: boolean, description: "Whether GET /api/v1/rows/{row_id} offers more." }
        items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
    HomeLayoutRow:
      type: object
      required: [key, title, description, enabled]
      properties:
        key: { type: string, description: "A row slot: continue_watching, recently_added_movies, seasonal, genres, collections and so on." }
        title: { type: string }
        description: { type: string }
        enabled: { type: boolean }
    HomeLayout:
      type: object
      required: [rows, source]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/HomeLayoutRow" }, description: "Every slot once, in Home's order." }
        source: { type: string, enum: [user, server, default], description: "Whose layout this is." }
    HomeLayoutInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [key, enabled]
            properties:
              key: { type: string }
              enabled: { type: boolean }
    VideoCodecCapability:
      type: object
      required: [codec]
      properties:
        codec: { type: string, description: "FFprobe name: h264, hevc, av1, vp9, vp8, mpeg2video, mpeg4, vc1." }
        profiles: { type: array, items: { type: string }, description: "Lower case FFprobe profile names: main, high, main 10, high 10. Empty means any." }
        max_bit_depth: { type: integer }
        max_width: { type: integer }
        max_height: { type: integer }
        max_fps: { type: number }
    AudioCodecCapability:
      type: object
      required: [codec]
      properties:
        codec: { type: string, description: "FFprobe name: aac, ac3, eac3, dts, truehd, flac, opus, vorbis, mp3, mp2, pcm_s16le, alac." }
        max_channels: { type: integer }
        decoder: { type: string, enum: [hardware, software, ffmpeg_extension, passthrough] }
    Capabilities:
      type: object
      required: [containers, video_codecs, audio_codecs]
      properties:
        containers: { type: array, items: { type: string }, description: "Containers the player demuxes: mkv, mp4, webm, ts, avi, mov, flv." }
        video_codecs: { type: array, items: { $ref: "#/components/schemas/VideoCodecCapability" } }
        audio_codecs: { type: array, items: { $ref: "#/components/schemas/AudioCodecCapability" } }
        hdr_types: { type: array, items: { type: string, enum: [hdr10, hdr10plus, hlg, dolby_vision] } }
        subtitle_codecs: { type: array, items: { type: string }, description: "subrip, ass, ssa, webvtt, mov_text, ttml, dvb_subtitle, hdmv_pgs_subtitle, dvd_subtitle." }
        max_width: { type: integer }
        max_height: { type: integer }
        max_bitrate: { type: integer }
        fmp4_stream: { type: boolean, description: "The client plays a fragmented MP4 stream that seeks by asking for a new one. Only then are files it cannot play directly converted (video copied or transcoded to H.264, audio copied or converted)." }
        hls_stream: { type: boolean, description: "The client plays HLS with fragmented MP4 segments natively (Safari). Files it cannot play directly are converted as for fmp4_stream and come as HLS (protocol hls)." }
        default_audio_only: { type: boolean, description: "The client plays only the default audio track (a browser), so that track is the one that has to decode." }
    PlaybackRequest:
      type: object
      required: [capabilities]
      properties:
        item_id: { type: integer, description: A movie or episode. Required unless extra_id is given. }
        version_id: { type: [integer, "null"], description: Omit to let the server pick the best version the device can play. }
        start_position_ms: { type: [integer, "null"], description: Omit to resume from the saved position. }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        extra_id:
          type: [integer, "null"]
          description: >-
            Play one of the item's extras (a trailer) instead of a version. item_id may then be omitted or 0; when
            given it must be the extra's item. Same decision ladder and policy as a version; no watch state is
            written, and theme music is refused (422).
    SubtitleSource:
      type: object
      required: [track_id, url, codec, mime_type]
      properties:
        track_id: { type: integer }
        url: { type: string, description: Path relative to the server base URL. }
        codec: { type: string }
        mime_type: { type: string, description: "application/x-subrip, text/x-ssa, text/vtt, application/ttml+xml" }
        language: { type: [string, "null"] }
        title: { type: [string, "null"] }
        is_forced: { type: boolean }
        embedded: { type: boolean, description: "True for a track inside the media file. Players that read the container already have it; browsers use the WebVTT URL." }
        downloaded: { type: boolean, description: A subtitle the server downloaded from OpenSubtitles. Side-load it like a sidecar file. }
    PlaybackSession:
      type: object
      required: [session_id, decision, reason, item_id, version, stream, resume_position_ms, heartbeat_interval_ms]
      properties:
        session_id: { type: string }
        decision: { type: string, enum: [direct_play, remux, audio_transcode, transcode] }
        reason: { type: string, description: Why this decision, in plain words. Recorded in activity. }
        item_id: { type: integer }
        extra_id: { type: integer, description: Present when the session plays an extra. }
        version: { $ref: "#/components/schemas/Version", description: "The file being played; for an extra, its id is the extra's." }
        stream:
          type: object
          required: [url, protocol]
          properties:
            url: { type: string, description: Path relative to the server base URL; send the bearer header. }
            protocol: { type: string, enum: [progressive, hls, fmp4], description: "fmp4 and hls: a converted stream; see seek_url." }
            mime_type: { type: [string, "null"], description: "video/x-matroska, video/mp4, ..." }
            seek_url: { type: string, description: "For fmp4 and hls, the seek endpoint to call with position_ms before playing. For hls, url is the seek endpoint too: every HLS stream starts at a position." }
        subtitles: { type: array, items: { $ref: "#/components/schemas/SubtitleSource" }, description: Sidecar files to add as side-loaded tracks. Embedded tracks come from the container. }
        webvtt_subtitles:
          type: array
          items: { $ref: "#/components/schemas/SubtitleSource" }
          description: >-
            Every text subtitle, sidecar or embedded, as a WebVTT URL, for clients that read only WebVTT (browsers).
            Picture subtitles (PGS, VobSub) are left out. An embedded track's URL answers 202 while the server reads
            it out of the file; retry after the Retry-After seconds.
        resume_position_ms: { type: integer }
        heartbeat_interval_ms: { type: integer }
        subtitle_offset_ms:
          type: integer
          description: >-
            The user's subtitle delay for this version, set with PUT /versions/{version_id}/subtitle-offset. Positive
            shows subtitles later. URLs in webvtt_subtitles are already shifted by it. A player that side-loads the
            files in subtitles, or shows tracks from inside the container, applies it itself (Media3: shift the cue
            times, or offset the text renderer's position by this many ms). Do not apply it to a WebVTT URL again.
        subtitle_search:
          type: object
          required: [enabled, can_download]
          properties:
            enabled: { type: boolean, description: Offer "Search for subtitles". }
            can_download: { type: boolean, description: The user may download a result. }
        markers:
          type: array
          description: The item's intro and credits, each saying whether this user's settings skip it without asking.
          items:
            allOf:
              - $ref: "#/components/schemas/Marker"
              - type: object
                required: [auto_skip]
                properties:
                  auto_skip: { type: boolean, description: "True only for an intro, when skip_markers is auto and confidence is at least 0.75. Credits are never skipped without a press." }
        skip_markers: { type: string, enum: [button, auto, off], description: The user's choice; off means show no Skip button. }
    Marker:
      type: object
      required: [kind, start_ms, end_ms, confidence, source]
      properties:
        kind: { type: string, enum: [intro, credits] }
        start_ms: { type: integer }
        end_ms: { type: integer, description: "Where Skip lands. Credits that run to the end of the file end at its duration, so a player can go to the next episode; credits followed by a scene end before it." }
        confidence: { type: number, description: "1 for markers from the file or an admin; 0 to 1 for detected ones." }
        source: { type: string, enum: [detected, chapter, nfo, manual] }
    MarkerList:
      type: object
      required: [markers]
      properties:
        markers: { type: array, items: { $ref: "#/components/schemas/Marker" } }
    PlaybackSettings:
      type: object
      required: [skip_markers]
      properties:
        skip_markers:
          type: string
          enum: [button, auto, off]
          description: "Intros: show a Skip button (the default), skip automatically (only confident markers; otherwise the button), or neither. Credits always get a button when not off."
    PlaybackEvent:
      type: object
      required: [type, position_ms]
      properties:
        type: { type: string, enum: [start, pause, resume, seek, progress, buffering, stop, error] }
        position_ms: { type: integer }
        from_position_ms: { type: [integer, "null"], description: For seek. }
        duration_ms: { type: [integer, "null"] }
        message: { type: [string, "null"], description: For error. }
    AdminLibrary:
      allOf:
        - $ref: "#/components/schemas/Library"
        - type: object
          properties:
            root_path: { type: string }
            grouping: { type: string, enum: [folder, title_year] }
            scan_interval_minutes: { type: integer }
            last_scan: { oneOf: [{ $ref: "#/components/schemas/ScanRun" }, { type: "null" }] }
    LibraryInput:
      type: object
      required: [name, kind, root_path]
      properties:
        name: { type: string }
        kind: { type: string, enum: [movie, show] }
        root_path: { type: string, description: Absolute path inside the container, under a configured media root. }
        grouping: { type: string, enum: [folder, title_year], default: folder }
        scan_interval_minutes: { type: integer, default: 60 }
    ScanRun:
      type: object
      required: [id, library_id, trigger, status, started_at]
      properties:
        id: { type: integer }
        library_id: { type: integer }
        trigger: { type: string }
        path_filter: { type: [string, "null"] }
        status: { type: string, enum: [running, ok, error, aborted] }
        error: { type: [string, "null"] }
        files_seen: { type: integer }
        files_added: { type: integer }
        files_changed: { type: integer }
        files_missing: { type: integer }
        files_failed: { type: integer }
        started_at: { type: integer }
        finished_at: { type: [integer, "null"] }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            disabled: { type: boolean }
            library_ids: { type: array, items: { type: integer } }
            policy: { $ref: "#/components/schemas/UserPolicy" }
            created_at: { type: integer }
            summary: { type: string, description: 'The policy in one plain-English line, e.g. "Sees Movies and TV, up to 1080p and PG-13, never titles labelled horror."' }
    UserInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
        is_admin: { type: boolean, default: false }
        library_ids: { type: array, items: { type: integer } }
    UserPolicy:
      type: object
      properties:
        max_resolution: { oneOf: [{ $ref: "#/components/schemas/Resolution" }, { type: "null" }], description: Versions above this are invisible to the user. }
        max_content_rating:
          type: [string, "null"]
          enum: [G, PG, PG-13, R, NC-17, null]
          description: >-
            Titles rated above this are invisible to the user. Each tier admits the TV ratings for the same audience
            (PG-13 allows TV-14, R allows TV-MA). Seasons and episodes go by their show's rating, or their own when stricter.
            While a ceiling is set, titles with no known rating are hidden.
        allow_labels:
          type: array
          items: { type: string }
          description: When not empty, only titles carrying one of these labels (on the title or its show) are visible.
        deny_labels:
          type: array
          items: { type: string }
          description: Titles carrying any of these labels (on the title or its show) are invisible.
        allow_transcode: { type: boolean }
        allow_4k_transcode: { type: boolean }
        allow_subtitle_download: { type: boolean, description: May download subtitles from OpenSubtitles (spends the server's daily quota). Default false; admins always may. }
    SubtitleHit:
      type: object
      required: [file_id, language_code, release, file_name, hearing_impaired, hash_match, trusted, download_count, matched_by]
      properties:
        file_id: { type: integer, description: Pass to the download route. }
        language: { type: [string, "null"], description: ISO 639-2/B, like every other track. }
        language_code: { type: string, description: OpenSubtitles' own code (ISO 639-1). }
        release: { type: string }
        file_name: { type: string }
        hearing_impaired: { type: boolean }
        hash_match: { type: boolean, description: Made for this exact file. }
        trusted: { type: boolean, description: From a trusted uploader. }
        download_count: { type: integer }
        uploader: { type: string }
        matched_by: { type: string, enum: [hash, id, title] }
        stream_id: { type: [integer, "null"], description: Set when this version already has the file. }
    DownloadedSubtitle:
      type: object
      required: [stream_id, version_id, release, hearing_impaired, hash_match, codec, existing]
      properties:
        stream_id: { type: integer, description: "The subtitle track id, as in /subtitles/{stream_id}." }
        version_id: { type: integer }
        language: { type: [string, "null"] }
        release: { type: string }
        hearing_impaired: { type: boolean }
        hash_match: { type: boolean }
        codec: { type: string }
        existing: { type: boolean, description: Already downloaded; no quota spent. }
    SubtitleDownloadResult:
      type: object
      required: [subtitle, webvtt]
      properties:
        subtitle: { $ref: "#/components/schemas/DownloadedSubtitle" }
        webvtt: { $ref: "#/components/schemas/SubtitleSource" }
        quota: { $ref: "#/components/schemas/SubtitleQuota" }
    SubtitleQuota:
      type: object
      description: OpenSubtitles downloads left today, as last reported. Admins only.
      required: [known, remaining, allowed, reset_at, checked_at]
      properties:
        known: { type: boolean }
        remaining: { type: integer }
        allowed: { type: integer }
        reset_at: { type: string, format: date-time, description: Zero time when not reported. }
        level: { type: string }
        checked_at: { type: string, format: date-time }
    ActivityEntry:
      type: object
      required: [id, state, decision, decision_reason, start_position_ms, position_ms, played_ms, watched, started_at, last_event_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [created, playing, paused, buffering, stopped, error, refused] }
        decision: { type: string, enum: [direct_play, remux, audio_transcode, transcode, refused] }
        decision_reason: { type: string }
        user_id: { type: [integer, "null"] }
        username: { type: [string, "null"] }
        item_id: { type: [integer, "null"] }
        item_kind: { type: [string, "null"] }
        item_title: { type: [string, "null"], description: Snapshot at play time; episodes read "Show S01E02 Title". }
        show_id: { type: [integer, "null"], description: "For an episode, its show, for the poster." }
        version_summary: { type: [string, "null"] }
        bitrate: { type: [integer, "null"] }
        device_name: { type: [string, "null"] }
        device_model: { type: [string, "null"] }
        platform: { type: [string, "null"] }
        client: { type: [string, "null"] }
        client_version: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        location: { $ref: "#/components/schemas/Location" }
        start_position_ms: { type: integer }
        position_ms: { type: integer }
        duration_ms: { type: [integer, "null"] }
        progress: { type: [number, "null"], description: 0 to 1. }
        played_ms: { type: integer, description: Wall time actually spent playing. }
        watched: { type: boolean, description: Reached 90%. }
        started_at: { type: integer }
        last_event_at: { type: integer }
        ended_at: { type: [integer, "null"] }
        terminated_message: { type: [string, "null"] }
    TitleWatch:
      type: object
      required: [item_id, kind, title, year, library_id, library, paths, size_bytes, added_at, last_played_at, play_count, finished_by]
      properties:
        item_id: { type: integer }
        kind: { type: string, enum: [movie, show] }
        title: { type: string }
        year: { type: [integer, "null"] }
        library_id: { type: integer }
        library: { type: string }
        paths: { type: array, items: { type: string }, description: "Absolute paths of the files on disk, as the server sees them; a show lists every episode's files." }
        size_bytes: { type: integer }
        added_at: { type: integer }
        last_played_at:
          type: [integer, "null"]
          description: The latest play by anyone, a session in progress included. Null when nobody ever played it.
        play_count: { type: integer, description: Times finished, summed over users (and episodes, for a show). }
        finished_by: { type: array, items: { type: string }, description: "Users who have it marked watched; for a show, every episode on disk." }
        episodes_total: { type: integer, description: Shows only. Episodes on disk. }
        episodes_watched: { type: integer, description: Shows only. Episodes at least one user has watched. }
    Ranked:
      type: object
      required: [name, plays, watch_ms, users]
      properties:
        id: { type: [integer, "null"] }
        name: { type: string }
        plays: { type: integer }
        watch_ms: { type: integer }
        users: { type: integer }
    ActivityStats:
      type: object
      required: [days, since, plays, watch_ms, users, refused, top_movies, top_shows, top_users, platforms, devices, decisions, by_day, by_hour, by_weekday, playback_types, platform_types, peak_streams, peak_at]
      properties:
        days: { type: integer }
        since: { type: integer }
        plays: { type: integer }
        watch_ms: { type: integer }
        users: { type: integer }
        refused: { type: integer }
        top_movies: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
        top_shows: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
        top_users: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
        platforms: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
        devices: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
        decisions: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
        by_day:
          type: array
          items:
            type: object
            required: [date, plays, watch_ms]
            properties:
              date: { type: string, format: date }
              plays: { type: integer }
              watch_ms: { type: integer }
        by_hour: { type: array, items: { type: integer }, minItems: 24, maxItems: 24 }
        by_weekday: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: Sunday first. }
        playback_types:
          type: array
          items: { $ref: "#/components/schemas/Ranked" }
          description: Counted plays by decision (direct_play, remux, audio_transcode, transcode), most first.
        platform_types:
          type: array
          items: { $ref: "#/components/schemas/Ranked" }
          description: Counted plays by kind of device, such as "Google TV" or "Web (Chrome)".
        peak_streams: { type: integer, description: The most counted plays at once in the range. }
        peak_at: { type: integer, description: When that peak began; 0 when there were no plays. }
    Location:
      type: string
      enum: ["", This server, Tailscale, Local network, Internet]
      description: >-
        The kind of network an address is on, worked out offline. Public addresses are not placed on a map.
    NewsletterSettings:
      type: object
      required: [enabled, weekday, hour]
      properties:
        enabled: { type: boolean }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
        hour: { type: integer, minimum: 0, maximum: 23, description: In the server's time zone. }
        audience_user_id:
          type: integer
          default: 0
          description: >-
            Whose view the digest is built from: an enabled account that is not an admin. It lists only what that
            account may see (granted libraries, label rules). 0, the default, means only titles every enabled
            non-admin account can see.
    NewsletterStatus:
      allOf:
        - { $ref: "#/components/schemas/NewsletterSettings" }
        - type: object
          required: [time_zone, audience, webhooks, last_sent, next_send]
          properties:
            time_zone: { type: string }
            audience: { type: string, description: Whose view the digest uses, in words. }
            webhooks:
              type: integer
              description: How many webhook URLs take the newsletter; 0 when none is set or webhook_events leaves newsletter out.
            last_sent: { type: [integer, "null"], description: When the last week was handled, or the settings last saved. }
            next_send: { type: [integer, "null"], description: Null while off. }
    ActivitySession:
      type: object
      required: [id, decision, decision_reason, state, started_at]
      properties:
        id: { type: string }
        user_id: { type: [integer, "null"] }
        username: { type: [string, "null"] }
        item_id: { type: [integer, "null"] }
        item_title: { type: [string, "null"] }
        version_id: { type: [integer, "null"] }
        version_summary: { type: [string, "null"] }
        device_name: { type: [string, "null"] }
        device_model: { type: [string, "null"] }
        client: { type: [string, "null"] }
        client_version: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        decision: { type: string }
        decision_reason: { type: string }
        state: { type: string }
        start_position_ms: { type: integer }
        last_position_ms: { type: integer }
        duration_ms: { type: [integer, "null"] }
        played_ms: { type: integer }
        started_at: { type: integer }
        last_event_at: { type: integer }
        ended_at: { type: [integer, "null"] }
